<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<defs>
<linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f4ee"/><stop offset="1" stop-color="#e4dacb"/></linearGradient>
<linearGradient id="realm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#66758b"/><stop offset="1" stop-color="#242a35"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343d4d"/><stop offset="1" stop-color="#12161e"/></linearGradient>
</defs>
<rect width="1200" height="1800" fill="#d8d0c3"/>
<text x="64" y="70" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#211f1b">AVELUNE · P1 VISUAL SURFACE PROOF</text>
<text x="64" y="104" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#625d54">REALM · CONSEQUENCE · MOBILE COMPOSITION</text>

<!-- Realm -->
<rect x="64" y="145" width="1072" height="620" rx="22" fill="url(#realm)"/>
<circle cx="905" cy="260" r="90" fill="#d4b56b" opacity=".7"/>
<path d="M64 610 L190 470 L280 540 L390 410 L510 540 L650 430 L790 555 L930 390 L1136 570 L1136 765 L64 765Z" fill="#202732"/>
<path d="M300 560 L380 420 L460 560 Z" fill="#454d58"/><rect x="335" y="500" width="90" height="70" fill="#343b45"/>
<path d="M610 600 L700 460 L790 600 Z" fill="#555d67"/><rect x="650" y="530" width="100" height="70" fill="#3c434c"/>
<path d="M850 620 L930 490 L1010 620 Z" fill="#4c5561"/><rect x="885" y="550" width="90" height="70" fill="#353c47"/>
<rect x="90" y="165" width="300" height="58" rx="12" fill="#171614" opacity=".88"/>
<text x="118" y="201" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f0e8">REALM · THE NORTH ROAD</text>
<rect x="90" y="640" width="1020" height="92" rx="14" fill="#fffdfc"/>
<text x="118" y="678" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#211f1b">A kingdom under pressure — prosperity and security are both visible.</text>
<text x="118" y="710" font-family="Arial,sans-serif" font-size="15" fill="#625d54">Environment carries authored state, not decorative fantasy.</text>

<!-- Consequence -->
<rect x="64" y="810" width="1072" height="420" rx="22" fill="#24211d"/>
<text x="96" y="858" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#d4b56b">CONSEQUENCE · RECORDED STATE</text>
<rect x="96" y="890" width="480" height="260" rx="16" fill="url(#night)"/>
<path d="M120 1110 Q210 950 330 970 Q450 950 550 1110Z" fill="#657594"/>
<circle cx="330" cy="960" r="60" fill="#b98769"/>
<path d="M270 960 Q270 890 330 885 Q390 890 390 960 Q360 925 330 925 Q300 925 270 960Z" fill="#302b2a"/>
<rect x="610" y="890" width="490" height="92" rx="14" fill="#4d725a"/>
<text x="642" y="927" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">STABILITY · CONFIRMED</text>
<text x="642" y="955" font-family="Arial,sans-serif" font-size="14" fill="#e9f2eb">The chronicle records the choice.</text>
<rect x="610" y="1002" width="490" height="148" rx="14" fill="#fffdfc"/>
<text x="642" y="1042" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#211f1b">No reward explosion.</text>
<text x="642" y="1080" font-family="Arial,sans-serif" font-size="16" fill="#625d54">Use restrained motion, semantic iconography</text>
<text x="642" y="1107" font-family="Arial,sans-serif" font-size="16" fill="#625d54">and a visible causal state change.</text>

<!-- Mobile proof -->
<rect x="64" y="1275" width="1072" height="455" rx="22" fill="url(#parchment)"/>
<text x="96" y="1325" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#4c5d7a">MOBILE 360–412DP PROOF</text>
<rect x="130" y="1360" width="300" height="330" rx="24" fill="#171614"/>
<rect x="146" y="1380" width="268" height="290" rx="16" fill="#f7f4ee"/>
<text x="168" y="1410" font-family="Arial,sans-serif" font-size="11" fill="#625d54">AVELUNE · EVENT</text>
<rect x="168" y="1430" width="224" height="82" rx="10" fill="#303746"/>
<circle cx="280" cy="1460" r="27" fill="#b98769"/>
<rect x="168" y="1525" width="224" height="55" rx="8" fill="#fffdfc"/>
<text x="180" y="1550" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#211f1b">The council waits.</text>
<rect x="168" y="1590" width="224" height="32" rx="7" fill="#4c5d7a"/>
<text x="180" y="1611" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">Hear the Commons</text>
<text x="500" y="1415" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#211f1b">Quality gates</text>
<text x="500" y="1460" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• 360dp portrait</text>
<text x="500" y="1492" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• 412dp portrait</text>
<text x="500" y="1524" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• light + dark</text>
<text x="500" y="1556" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• RTL mirroring</text>
<text x="500" y="1588" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• long strings / large text</text>
<text x="500" y="1620" font-family="Arial,sans-serif" font-size="17" fill="#625d54">• thumbnail recognition</text>
<text x="500" y="1665" font-family="Arial,sans-serif" font-size="15" fill="#8a6828">No subjective score: PASS / FAIL + defect.</text>
</svg>