<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Choice Kingdom premium character roster study v1</title>
<desc id="desc">Six differentiated recurring-character visual studies derived from names present in the authored source patchset. These are visual studies only and are not canonical People bindings or final production portraits.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151923"/><stop offset="1" stop-color="#090b10"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272d3a"/><stop offset="1" stop-color="#171b24"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c5a7"/><stop offset="1" stop-color="#a97961"/></linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d6874"/><stop offset="1" stop-color="#292c36"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".38"/></filter>
  <style>
    .label{font:600 15px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#d8b56a}
    .name{font:600 25px Georgia,serif;fill:#f4f0e6}
    .note{font:14px system-ui,sans-serif;fill:#aeb3c0}
    .small{font:12px system-ui,sans-serif;fill:#777f90}
  </style>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<text x="70" y="62" class="label">PREMIUM CHARACTER ART · ROSTER STUDY V1</text>
<text x="70" y="103" class="name">Six recurring-source identities — visual differentiation pass</text>
<text x="70" y="132" class="note">Study only. Canonical People binding, final artwork, provenance and production approval remain open.</text>

<!-- card helper geometry repeated manually for deterministic SVG -->
<g filter="url(#shadow)">
  <rect x="60" y="170" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
  <rect x="435" y="170" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
  <rect x="810" y="170" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
  <rect x="60" y="455" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
  <rect x="435" y="455" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
  <rect x="810" y="455" width="330" height="250" rx="18" fill="url(#panel)" stroke="#3b4250"/>
</g>

