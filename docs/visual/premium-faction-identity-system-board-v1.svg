  <text x="90" y="920" fill="#aaa69d" font-family="Arial,sans-serif" font-size="17">QA boundary: symbols are deliberately non-canonical until authoritative faction IDs, names, and provenance are verified.</text>
  <text x="90" y="950" fill="#aaa69d" font-family="Arial,sans-serif" font-size="17">Color is supplementary only; identity must survive monochrome, 24dp scale, RTL mirroring, and large-text layouts.</text>
