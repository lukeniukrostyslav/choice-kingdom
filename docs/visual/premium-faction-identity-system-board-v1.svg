      <text x="180" y="85" fill="#eee5d5" font-size="24" font-weight="700">B — MERCHANT</text><text x="180" y="118" fill="#aaa69d" font-size="17">contained geometry</text><text x="180" y="145" fill="#aaa69d" font-size="17">measured rhythm</text><text x="180" y="172" fill="#aaa69d" font-size="17">material detail</text>
