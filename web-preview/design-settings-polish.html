<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings Polish Lab</title><style>:root{font:16px system-ui;background:#111;color:#eee;--card:#1b1c22;--muted:#aaa;--accent:#d8b56a;--line:#3b3b43}body{margin:0;padding:24px}main{max-width:720px;margin:auto}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}label{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;border-bottom:1px solid var(--line)}select,button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#25262d;color:#fff;padding:0 14px}button.primary{border-color:var(--accent);width:100%;margin-top:14px}.hint{color:var(--muted);font-size:.9rem}kbd{border:1px solid var(--line);padding:3px 6px;border-radius:5px}@media(max-width:560px){body{padding:16px}label{align-items:flex-start;padding:10px 0;flex-direction:column}}[dir=rtl]{text-align:right}</style></head><body><main><div class="eyebrow">Settings · accessibility polish</div><h1>Settings</h1><section class="card"><label><span>Theme<br><small class="hint">System, light, or dark</small></span><select><option>System</option><option>Light</option><option>Dark</option></select></label><label><span>Large text<br><small class="hint">Increase reading and decision text</small></span><button aria-pressed="false">Off</button></label><label><span>Reduced motion<br><small class="hint">Respect motion sensitivity</small></span><button aria-pressed="false">Off</button></label><label><span>Interface direction<br><small class="hint">Mirrors layout for RTL locales</small></span><select><option>Auto</option><option>LTR</option><option>RTL</option></select></label></section><section class="card"><h2>Accessibility contract</h2><p class="hint">Controls expose names and states to assistive technology. No state relies on color alone. Touch targets are at least 48dp; preferred primary actions are 56dp. Settings remain usable with long localized strings.</p><button class="primary">Restore defaults</button></section></main></body></html>
