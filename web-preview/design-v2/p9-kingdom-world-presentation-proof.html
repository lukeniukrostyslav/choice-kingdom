<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="tokens.css"><title>Choice Kingdom — V2 P9 Kingdom / World Presentation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ck-text-primary);font:16px/var(--ck-leading-body) var(--ck-body);background:radial-gradient(circle at 72% 0,rgba(77,101,125,.3),transparent 34%),linear-gradient(180deg,var(--ck-world-800),var(--ck-world-950))}
main{width:min(1120px,100%);margin:auto;padding:max(20px,calc(20px + env(safe-area-inset-top))) max(18px,calc(18px + env(safe-area-inset-right))) max(36px,calc(36px + env(safe-area-inset-bottom))) max(18px,calc(18px + env(safe-area-inset-left)))}
.eyebrow,.label{font-size:var(--ck-type-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ck-gold-primary)}
.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.top h1{font:500 var(--ck-type-display-md)/var(--ck-leading-heading) var(--ck-serif);margin:6px 0 0}.context{color:var(--ck-text-muted);font-size:var(--ck-type-body-sm);text-align:end}
.world{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(320px,.82fr);gap:18px}
.world-map{position:relative;min-height:600px;overflow:hidden;border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-lg);background:linear-gradient(145deg,#172536,#0a111b);box-shadow:var(--ck-shadow-deep)}
.map-art{position:absolute;inset:0;background:radial-gradient(ellipse at 58% 26%,rgba(227,201,134,.18),transparent 20%),radial-gradient(ellipse at 54% 40%,rgba(75,99,122,.45),transparent 38%),linear-gradient(160deg,transparent 0 38%,rgba(8,13,21,.2) 55%,rgba(8,13,21,.92) 88%),linear-gradient(180deg,#26384b,#0b121b 70%)}
.map-art:before{content:"";position:absolute;width:46%;height:58%;left:27%;top:12%;border:1px solid rgba(227,201,134,.2);border-radius:48% 48% 42% 42%;box-shadow:0 0 70px rgba(227,201,134,.08);background:radial-gradient(ellipse at 50% 34%,rgba(220,212,194,.2),transparent 28%),linear-gradient(145deg,rgba(27,39,52,.55),rgba(8,13,21,.72))}
.world-copy{position:absolute;inset-inline:0;inset-block-end:0;padding:clamp(24px,4vw,42px)}.world-copy h2{font:500 var(--ck-type-display-lg)/var(--ck-leading-heading) var(--ck-serif);margin:6px 0 8px}.world-copy p{max-width:56ch;margin:0;color:var(--ck-text-secondary);font-size:var(--ck-type-body-lg)}
.panel{border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-lg);background:linear-gradient(180deg,rgba(19,29,42,.94),rgba(12,19,29,.97));box-shadow:var(--ck-shadow-deep);padding:24px}.panel h3{font:500 var(--ck-type-display-md)/var(--ck-leading-heading) var(--ck-serif);margin:0 0 14px}
.identity{display:grid;gap:12px;margin-bottom:20px}.fact{padding:12px 14px;border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-md);background:rgba(8,13,21,.5)}.fact span{display:block;color:var(--ck-text-muted);font-size:var(--ck-type-label);letter-spacing:.12em;text-transform:uppercase}.fact strong{display:block;margin-top:3px}
.relationship{padding:16px;border-inline-start:2px solid var(--ck-gold-primary);background:rgba(8,13,21,.42);margin-bottom:18px}.relationship p{margin:5px 0 0;color:var(--ck-text-secondary)}
.state{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-md);margin-bottom:18px}.state strong{font-family:var(--ck-serif);font-size:18px}.dot{width:10px;height:10px;border-radius:50%;background:var(--ck-gold-highlight);box-shadow:0 0 0 4px rgba(227,201,134,.1)}
.actions{display:grid;gap:10px}.action{min-height:52px;padding:13px 16px;text-align:start;border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-md);background:linear-gradient(145deg,var(--ck-surface-elevated),var(--ck-surface-solid));color:var(--ck-text-primary);font:500 16px/1.25 var(--ck-body);cursor:pointer}.action:hover{border-color:var(--ck-border-strong)}.action:focus-visible{outline:3px solid var(--ck-focus);outline-offset:4px}.action[aria-pressed=true]{border-color:var(--ck-gold-highlight);box-shadow:0 0 0 1px rgba(227,201,134,.18)}
.status{min-height:24px;margin:14px 0 0;color:var(--ck-text-muted)}.status strong{color:var(--ck-gold-highlight)}.note{margin-top:16px;color:var(--ck-text-muted);font-size:var(--ck-type-body-sm)}
@media(max-width:760px){.character{grid-template-columns:1fr}.portrait{min-height:500px}.context{text-align:start}.top{align-items:start;flex-direction:column;gap:6px}}
@media(max-width:420px){main{padding-inline:14px}.panel{padding:18px}.world-map{min-height:430px}.world-copy{padding:20px 16px}.action{min-height:56px}}
@media(prefers-reduced-motion:reduce){.action{transition:none}}html[dir=rtl] .context{text-align:start}
.map-art:after{content:"";position:absolute;inset:10% 8% 22%;border:1px solid rgba(227,201,134,.16);border-radius:46% 54% 48% 52%;background:radial-gradient(circle at 70% 25%,rgba(227,201,134,.12),transparent 18%),radial-gradient(circle at 35% 62%,rgba(37,74,73,.34),transparent 30%);opacity:.9}.mountain{position:absolute;z-index:2;bottom:30%;width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-bottom:170px solid rgba(90,111,125,.48)}.m1{left:10%}.m2{right:8%;bottom:36%;border-left-width:140px;border-right-width:140px;border-bottom-width:210px;opacity:.72}.river{position:absolute;z-index:3;left:48%;top:0;width:90px;height:100%;background:linear-gradient(150deg,transparent 0 24%,rgba(94,143,164,.62) 32%,rgba(42,79,98,.76) 54%,rgba(94,143,164,.42) 70%,transparent 78%);clip-path:polygon(38% 0,62% 0,54% 28%,76% 46%,48% 63%,64% 100%,35% 100%,40% 65%,22% 48%,45% 28%)}.road{position:absolute;z-index:4;height:12px;border-radius:50%;background:rgba(206,180,116,.56);box-shadow:0 0 18px rgba(227,201,134,.14);transform-origin:left center}.r1{left:18%;bottom:22%;width:65%;transform:rotate(-15deg)}.r2{left:38%;top:38%;width:48%;transform:rotate(31deg)}.city{position:absolute;z-index:6;left:50%;top:47%;width:54px;height:54px;border:2px solid var(--ck-gold-primary);border-radius:50%;background:rgba(8,13,21,.82);box-shadow:0 0 0 8px rgba(227,201,134,.08),0 0 42px rgba(227,201,134,.16);transform:translate(-50%,-50%)}.city:before,.city:after{content:"";position:absolute;left:50%;bottom:48%;width:3px;height:30px;background:var(--ck-gold-primary);transform-origin:bottom}.city:before{transform:translateX(-50%) rotate(-28deg)}.city:after{transform:translateX(-50%) rotate(28deg)}.city i,.city b{position:absolute;width:7px;height:7px;border:1px solid var(--ck-gold-primary);background:var(--ck-night-950)}.city i{left:-18px;top:24px}.city b{right:-18px;top:10px}.forest{position:absolute;z-index:5;width:90px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 65%,rgba(32,70,64,.78),transparent 48%),radial-gradient(circle at 65% 45%,rgba(26,57,54,.82),transparent 48%)}.f1{left:10%;top:48%}.f2{right:10%;bottom:18%}.world-copy{z-index:10}.world-map{background:linear-gradient(145deg,#172536,#0a111b)}
<body><main>
<header class="top"><div><div class="eyebrow">Avelune · Realm</div><h1>Realm</h1></div><div class="context">Eastern Marches<br>Realm overview</div></header>
<section class="world" aria-label="Avelune kingdom world presentation">
<article class="world-map" aria-labelledby="world-title"><div class="map-art" aria-hidden="true"><span class="mountain m1"></span><span class="mountain m2"></span><span class="river"></span><span class="road r1"></span><span class="road r2"></span><span class="city"><i></i><b></b></span><span class="forest f1"></span><span class="forest f2"></span></div><div class="world-copy"><div class="eyebrow">THE KINGDOM OF AVELUNE</div><h2 id="world-title">Avelune</h2><p>Mountains, water, forests and roads converge around the eastern marches, giving the realm a living sense of distance and consequence.</p></div></article>
<aside class="panel" aria-labelledby="record-title"><h3 id="record-title">Realm record</h3>
<div class="identity" aria-label="Realm facts"><div class="fact"><span>Region</span><strong>Eastern Marches</strong></div><div class="fact"><span>Landscape</span><strong>Roads & river</strong></div><div class="fact"><span>Landmark</span><strong>Eastern pass</strong></div></div>
<div class="relationship"><div class="label">World state</div><p>The eastern road is open, while winter still shapes travel and supply.</p></div>
<div class="state"><div><div class="label">Current condition</div><strong id="state">Winter roads</strong></div><span class="dot" aria-hidden="true"></span></div>
<div class="actions" role="group" aria-label="Presentation condition"><button class="action" aria-pressed="false" data-state="Winter roads">Guarded</button><button class="action" aria-pressed="false" data-state="Clear">Open</button><button class="action" aria-pressed="false" data-state="Blocked">Strained</button></div>
<p id="status" class="status" role="status" aria-live="polite">Current realm condition: <strong>Guarded</strong>.</p>
<p class="note">Presentation proof only: world identity, regional context and condition are rendered without creating new gameplay rules. Runtime remains canonical.</p>
</aside></section></main>
<script>const state=document.querySelector('#state'),status=document.querySelector('#status');document.querySelectorAll('.action').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.action').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const value=b.dataset.state;state.textContent=value;status.innerHTML='Current realm condition: <strong>'+value+'</strong>.';}));</script>
</body></html>
