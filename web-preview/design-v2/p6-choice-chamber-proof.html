<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="tokens.css"><title>Choice Kingdom — V2 P6 Choice Chamber</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ck-text-primary);font:16px/var(--ck-leading-body) var(--ck-body);background:radial-gradient(circle at 50% 4%,rgba(77,101,125,.45),transparent 34%),linear-gradient(180deg,var(--ck-world-800),var(--ck-world-950))}main{width:min(920px,100%);margin:auto;padding:max(24px,calc(24px + env(safe-area-inset-top))) max(18px,calc(18px + env(safe-area-inset-right))) max(36px,calc(36px + env(safe-area-inset-bottom))) max(18px,calc(18px + env(safe-area-inset-left)))}.eyebrow,.meta{font-size:var(--ck-type-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ck-gold-primary)}h1,h2{font-family:var(--ck-serif);font-weight:500}h1{font-size:var(--ck-type-display-md);line-height:var(--ck-leading-heading);margin:8px 0 12px}.scene{padding:clamp(22px,5vw,44px);border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-lg);background:linear-gradient(180deg,rgba(7,11,18,.18),var(--ck-overlay)),radial-gradient(circle at 75% 18%,rgba(215,182,108,.13),transparent 30%);box-shadow:var(--ck-shadow-deep)}.story{max-width:68ch;color:var(--ck-text-secondary)}.rule{height:1px;background:var(--ck-border-subtle);margin:28px 0}.choices{display:grid;gap:12px}.choice{position:relative;width:100%;min-height:64px;padding:14px 18px;text-align:start;color:var(--ck-text-primary);border:1px solid var(--ck-border-subtle);border-radius:var(--ck-radius-md);background:linear-gradient(145deg,var(--ck-surface-elevated),var(--ck-surface-solid));box-shadow:var(--ck-shadow-soft);font:500 21px/1.25 var(--ck-serif);cursor:pointer;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}.choice:hover{border-color:var(--ck-border-strong);transform:translateY(-1px)}.choice:focus-visible{outline:3px solid var(--ck-focus);outline-offset:4px}.choice[data-state=selected]{border-color:var(--ck-gold-highlight);box-shadow:0 0 0 1px rgba(227,201,134,.18),var(--ck-shadow-deep)}.choice[data-state=selected]::before{content:"Chosen";position:absolute;inset-block-start:10px;inset-inline-end:14px;color:var(--ck-gold-highlight);font:700 11px/1 var(--ck-body);letter-spacing:.14em;text-transform:uppercase}.choice[data-state=disabled]{opacity:.52;cursor:not-allowed}.choice[data-state=locked]{color:var(--ck-text-muted);border-style:dashed;cursor:not-allowed}.choice[data-state=locked]::after{content:"Unavailable";position:absolute;inset-block-end:10px;inset-inline-end:14px;color:var(--ck-text-muted);font:700 10px/1 var(--ck-body);letter-spacing:.12em;text-transform:uppercase}.state-note{min-height:24px;margin:18px 0 0;color:var(--ck-text-muted)}.state-note strong{color:var(--ck-gold-highlight)}@media(max-width:620px){main{padding-inline:14px}.scene{padding:22px 16px}.choice{min-height:72px;font-size:19px}}@media(prefers-reduced-motion:reduce){.choice{transition:none}.choice:hover{transform:none}}html[dir=rtl] .choice{text-align:right}
</style></head><body><main><section class="scene" aria-labelledby="title"><div class="eyebrow">Avelune · Consequential choice</div><h1 id="title">The eastern gate waits in silence.</h1><p class="story">Rain darkens the stone below the watchtower. Three paths are visible; the player can read the consequence context before committing. The choice chamber remains calm, focused and unmistakably interactive.</p><div class="rule"></div><div class="choices" role="group" aria-label="Available choices">
<button class="choice" data-state="default" aria-pressed="false">Open the eastern gate</button>
<button class="choice" data-state="default" aria-pressed="false">Send the envoy ahead</button>
<button class="choice" data-state="locked" aria-disabled="true">Cross the mountain pass</button>
<button class="choice" data-state="disabled" disabled>Withdraw from the council</button>
</div><p class="state-note" aria-live="polite" id="state">No choice selected.</p></section></main><script>
const choices=[...document.querySelectorAll('.choice:not([disabled]):not([data-state="locked"])')];
choices.forEach(button=>button.addEventListener('click',()=>{choices.forEach(b=>{b.dataset.state='default';b.setAttribute('aria-pressed','false')});button.dataset.state='selected';button.setAttribute('aria-pressed','true');document.querySelector('#state').innerHTML='<strong>Choice selected.</strong> The visual state is immediate and reversible until the runtime commits it.';}));
</script></body></html>
