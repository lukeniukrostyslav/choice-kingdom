<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a11">
<meta name="description" content="Choice Kingdom — Avelune">
<title>Choice Kingdom — Avelune</title>
<meta http-equiv="refresh" content="0;url=game-flow.html">
<style>
:root{--bg:#050a11;--ink:#f3efe5;--muted:#a8adb5;--gold:#d2b66f;--line:rgba(210,182,111,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 25%,rgba(56,83,111,.42),transparent 42%),linear-gradient(160deg,#07101b,#03070d)}
.splash{width:min(760px,100%);min-height:58vh;display:flex;align-items:flex-end;padding:clamp(28px,7vw,68px);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(15,28,43,.98),rgba(5,11,18,.98));box-shadow:0 30px 100px rgba(0,0,0,.5)}
.splash:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,rgba(210,182,111,.18),transparent 20%),linear-gradient(90deg,rgba(3,7,12,.98),rgba(3,7,12,.6),rgba(3,7,12,.25));pointer-events:none}
.content{position:relative;max-width:650px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.19em;text-transform:uppercase}.crest{width:64px;height:76px;border:1px solid rgba(210,182,111,.55);clip-path:polygon(50% 0,94% 17%,84% 77%,50% 100%,16% 77%,6% 17%);display:grid;place-items:center;color:var(--gold);font:28px Georgia,serif;background:rgba(210,182,111,.05);margin-bottom:24px}.title{font:500 clamp(54px,10vw,100px)/.86 Georgia,"Times New Roman",serif;margin:0 0 20px;letter-spacing:-.025em}.lead{font-size:clamp(17px,2.2vw,22px);color:#d7d3ca;margin:0 0 26px}.enter{display:inline-flex;align-items:center;min-height:56px;padding:14px 22px;border:1px solid rgba(210,182,111,.7);border-radius:14px;background:rgba(210,182,111,.12);color:var(--ink);text-decoration:none}.enter:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
<script>location.replace('game-flow.html')</script>
</head>
<body>
<main class="splash">
<div class="content">
<div class="crest" aria-hidden="true">✦</div>
<div class="eyebrow">Avelune · Choice Kingdom</div>
<h1 class="title">Choice Kingdom</h1>
<p class="lead">Every decision leaves a trace. Enter the kingdom.</p>
<a class="enter" href="game-flow.html">Enter the kingdom →</a>
</div>
</main>
</body>
</html>
