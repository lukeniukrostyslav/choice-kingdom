name: Choice Kingdom S01 Scenario Source Closure

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  s01-scenario-source-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical scenario source inventory
        run: python3 tools/compile_scenario_source_inventory.py
      - name: Validate canonical causal reachability contract
        run: python3 tools/validate_causal_reachability_contract.py
      - name: Validate canonical graph source closure
        run: python3 tools/validate_canonical_graph_closure.py
      - name: Validate S01 frozen scenario source closure
        run: python3 tools/validate_s01_scenario_closure.py
      - name: Validate S02 choice to state transition closure
        run: python3 tools/validate_s02_choice_state_transition_closure.py
      - name: Upload S01 machine closure report
        uses: actions/upload-artifact@v4
        with:
          name: choice-kingdom-s01-source-closure-${{ github.sha }}
          path: |
            docs/MACHINE_S01_SCENARIO_CLOSURE_01.json
            scenario-source-inventory.json
            docs/MACHINE_CAUSAL_REACHABILITY_01.json
            docs/MACHINE_CANONICAL_GRAPH_CLOSURE_01.json
          if-no-files-found: error

  android-production-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python test runner
        working-directory: .
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify canonical Android adapter
        working-directory: .
        run: python -m pytest -q tests/test_android_runtime.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK was produced
        run: test -s app/build/outputs/apk/debug/app-debug.apk
