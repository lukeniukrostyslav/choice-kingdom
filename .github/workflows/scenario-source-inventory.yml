name: Choice Kingdom Scenario Source Inventory

on:
  push:
    branches: [main]
    paths:
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'docs/EVENT_CATALOG*.md'
      - 'tools/compile_scenario_source_inventory.py'
      - '.github/workflows/scenario-source-inventory.yml'
  pull_request:
    paths:
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'docs/EVENT_CATALOG*.md'
      - 'tools/compile_scenario_source_inventory.py'
      - '.github/workflows/scenario-source-inventory.yml'
  workflow_dispatch:

jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical producer consumer inventory
        run: python3 tools/compile_scenario_source_inventory.py
      - name: Validate generated inventory shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('scenario-source-inventory.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema'] == 'choice-kingdom-scenario-source-inventory-2', data['schema']
          assert data['event_count'] == 272, data['event_count']
          assert len(data['events']) == 272
          assert data['events'][0]['event_id'] == 'E01'
          assert data['events'][-1]['event_id'] == 'E272'
          assert 'pred.transport_disruption' in data['consumers']
          assert 'history.guild_representation' in data['producers']
          assert 'history.cross_faction_package' in data['producers']
          assert 'same_event_shared_writers' in data
          assert 'contradictory_same_event_writers' not in data
          assert not data['predicate_cycles']
          print('inventory_shape=PASS')
          print(f"events={data['event_count']}")
          print(f"unique_output_tokens={len(data['producers'])}")
          print(f"trigger_tokens={len(data['consumers'])}")
          print(f"semantic_writer_collisions={len(data['semantic_writer_collisions'])}")
          print(f"reaffirmed_tokens={len(data.get('reaffirmed_tokens', {}))}")
          print(f"same_event_shared_writers={len(data['same_event_shared_writers'])}")
          print(f"undefined_consumers={len(data['undefined_consumers'])}")
          print(f"undefined_predicate_consumers={len(data['undefined_predicate_consumers'])}")
          print(f"predicate_nodes={len(data['predicate_dependency_graph'])}")
          print(f"predicate_edges={sum(len(v) for v in data['predicate_dependency_graph'].values())}")
          print(f"predicate_cycles={len(data['predicate_cycles'])}")
          PY
      - name: Upload source inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenario-source-inventory
          path: scenario-source-inventory.json

# S20 verification trigger: inventory schema/predicate-cycle assertion is part of the
# canonical scenario gate and does not alter authored scenario semantics.
# S23 verification trigger: expose deterministic inventory closure metrics in CI logs.
# S24 verification trigger: exhaustive inventory is executable on PRs as well as main pushes.
# S26 verification trigger: emitted-schema assertions are aligned with the inventory JSON.
