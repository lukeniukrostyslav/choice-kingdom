name: Choice Kingdom Block 10 Narrative Translation Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: block10-narrative-translation
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install translation bootstrap
        run: python -m pip install --upgrade pip deep-translator

      - name: Generate narrative packs
        run: python tools/generate_narrative_packs.py

      - name: Validate generated packs
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_block10_localization_contract.py \
            tests/test_block10_narrative_pack_repository.py \
            tests/test_block10_narrative_pack_completeness.py

      - name: Commit generated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/narrative
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "Block 10: populate release narrative translations"
          git push
