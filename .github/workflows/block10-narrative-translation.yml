name: Choice Kingdom Block 10 Narrative Translation Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: block10-narrative-translation
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install translation bootstrap
        run: python -m pip install --upgrade pip deep-translator pytest

      - name: Generate and validate each locale
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          for locale in ru uk it de fr es pt; do
            echo "=== $locale ==="
            python tools/generate_narrative_packs.py --locale "$locale"
            python -m pytest -q               tests/test_block10_localization_contract.py               tests/test_block10_narrative_pack_repository.py               tests/test_block10_narrative_pack_completeness.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "localization/narrative/$locale.json" localization/narrative/en.json
            git commit -m "Block 10: populate $locale narrative translations" || true
            git push
          done
