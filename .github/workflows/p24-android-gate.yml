name: P24 Android Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_p24_android_device_adaptation_contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android debug build
        working-directory: androidApp
        env:
          GRADLE_OPTS: -Xmx8g -XX:MaxMetaspaceSize=1g -Dorg.gradle.workers.max=1
          JAVA_TOOL_OPTIONS: -Xmx8g
        run: gradle :app:assembleDebug -Pp24CiAbi=x86_64 --stacktrace --no-daemon --max-workers=1

  android-execution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compact-phone
            width: 1080
            height: 2400
            density: 420
          - name: tablet-window
            width: 1920
            height: 2560
            density: 320
          - name: expanded-window
            width: 2688
            height: 2800
            density: 320
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK and AVD
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          command -v adb
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          command -v emulator
          command -v avdmanager
          echo "no" | avdmanager create avd --name "p24-${{ matrix.name }}" --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" --force
          AVD_DIR="$ANDROID_AVD_HOME/p24-${{ matrix.name }}.avd"
          test -f "$AVD_DIR/config.ini"
          {
            echo "hw.cpu.ncore=2"
            echo "hw.ramSize=4096"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.keyboard=yes"
          } >> "$AVD_DIR/config.ini"

      - name: Run P24 Android execution
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"
          "$ADB" version
          "$ADB" start-server
          "$EMULATOR" -version
          SERIAL=emulator-5554
          "$EMULATOR" -avd "p24-${{ matrix.name }}" -port 5554 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 2 -memory 4096 > "$RUNNER_TEMP/p24-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            kill "$EMULATOR_PID" 2>/dev/null || true
            "$ADB" -s "$SERIAL" emu kill 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 120); do
            if "$ADB" -s "$SERIAL" get-state 2>/dev/null | grep -q device; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/p24-emulator.log"; exit 1; fi
            sleep 2
          done
          "$ADB" -s "$SERIAL" get-state | grep -q device
          for i in $(seq 1 150); do
            BOOT=$("$ADB" -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/p24-emulator.log"; exit 1; fi
            sleep 2
          done
          "$ADB" -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          "$ADB" -s "$SERIAL" shell wm size ${{ matrix.width }}x${{ matrix.height }}
          "$ADB" -s "$SERIAL" shell wm density ${{ matrix.density }}
          cd androidApp
          export GRADLE_OPTS="-Xmx8g -XX:MaxMetaspaceSize=1g -Dorg.gradle.workers.max=1"
          export JAVA_TOOL_OPTIONS="-Xmx8g"
          gradle :app:assembleDebug -Pp24CiAbi=x86_64 --no-daemon --max-workers=1
          gradle :app:installDebug -Pp24CiAbi=x86_64 --no-daemon --max-workers=1
          "$ADB" -s "$SERIAL" shell am force-stop com.choicekingdom.app
          "$ADB" -s "$SERIAL" shell am start -n com.choicekingdom.app/.MainActivity
          sleep 12
          "$ADB" -s "$SERIAL" shell dumpsys activity activities | grep -q com.choicekingdom.app
          mkdir -p p24-evidence
          "$ADB" -s "$SERIAL" exec-out screencap -p > p24-evidence/${{ matrix.name }}.png
          gradle :app:connectedDebugAndroidTest --tests com.choicekingdom.app.P24DeviceAdaptationTest --no-daemon --max-workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p24-${{ matrix.name }}-evidence
          path: androidApp/p24-evidence
          if-no-files-found: warn
