name: Choice Kingdom Canonical Graph

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  canonical-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate authored choice transition semantics (S02)
        run: python3 tools/validate_choice_transition_semantics.py
      - name: Validate source-level canonical graph contract
        run: python3 tools/validate_canonical_graph.py
      - name: Validate canonical graph source closure
        run: python3 tools/validate_canonical_graph_closure.py
      - name: Validate S07 causal reachability contract
        run: python3 tools/validate_causal_reachability_contract.py
      - name: Validate frozen event graph integrity
        run: python3 tools/validate_event_graph_integrity.py
      - name: Validate frozen catalog to graph ID parity
        run: python3 tools/validate_catalog_graph_parity.py
      - name: Validate delayed inventory catalog scope
        run: python3 tools/validate_delayed_inventory_scope.py
      - name: Validate delayed lifecycle identity gate
        run: python3 tools/validate_delayed_lifecycle_gate.py
      - name: Validate delayed source token identity
        run: python3 tools/validate_delayed_source_tokens.py
      - name: Validate replay semantic classification
        run: python3 tools/validate_replay_semantic_classification.py
      - name: Validate replay producer provenance
        run: python3 tools/validate_replay_producer_provenance.py
      - name: Validate replay consumer trigger closure
        run: python3 tools/validate_replay_consumer_trigger_closure.py
      - name: Validate producer consumer collision contract
        run: python3 tools/validate_producer_consumer_collision.py
      - name: Validate source producer semantic equality
        run: python3 tools/validate_source_producer_semantic_equality.py
      - name: Validate ending prerequisite satisfiability contract
        run: python3 tools/validate_ending_prerequisite_satisfiability.py
      - name: Validate ending precedence boundary
        run: python3 tools/validate_ending_precedence_boundary.py
      - name: Validate ending alias boundary
        run: python3 tools/validate_ending_alias_boundary.py
      - name: Validate ending test matrix contract
        run: python3 tools/validate_ending_test_matrix_contract.py
      - name: Validate predicate dependency and cycle boundary
        run: python3 tools/validate_predicate_dependency_audit.py
      - name: Validate unresolved predicate producer boundary
        run: python3 tools/validate_predicate_open_boundary.py
      - name: Validate scenario QA gate matrix
        run: python3 tools/validate_scenario_qa_gate_matrix.py
      - name: Compile graph node classification inventory
        run: python3 tools/classify_graph_nodes.py
      - name: Compile producer consumer matrix
        run: python3 tools/compile_producer_consumer_matrix.py
      - name: Compile conservative candidate triage
        run: python3 tools/triage_graph_candidates.py
      - name: Audit semantic candidate boundary
        run: python3 tools/audit_candidate_semantic_boundary.py
      - name: Audit composite predicate source closure
        run: python3 tools/audit_composite_predicate_source_closure.py
      - name: Audit conservative structural reachability
        run: python3 tools/audit_structural_reachability.py
      - name: Upload canonical QA machine reports
        uses: actions/upload-artifact@v4
        with:
          name: choice-kingdom-canonical-qa-${{ github.sha }}
          path: |
            docs/MACHINE_GRAPH_NODE_CLASSIFICATION_01.json
            docs/MACHINE_PRODUCER_CONSUMER_MATRIX_01.json
            docs/MACHINE_CANDIDATE_TRIAGE_01.json
            docs/MACHINE_CANDIDATE_SEMANTIC_BOUNDARY_01.json
            docs/MACHINE_STRUCTURAL_REACHABILITY_01.json
            docs/MACHINE_CAUSAL_REACHABILITY_01.json
            docs/MACHINE_CATALOG_GRAPH_PARITY_01.json
            docs/MACHINE_CANONICAL_GRAPH_CLOSURE_01.json
            docs/MACHINE_DELAY_INVENTORY_SCOPE_01.json
            docs/MACHINE_DELAYED_LIFECYCLE_GATE_01.json
            docs/MACHINE_DELAYED_SOURCE_TOKEN_VALIDATION_01.json
            docs/MACHINE_REPLAY_SEMANTIC_CLASSIFICATION_01.json
            docs/MACHINE_REPLAY_PRODUCER_PROVENANCE_01.json
            docs/MACHINE_REPLAY_CONSUMER_TRIGGER_CLOSURE_01.json
            docs/MACHINE_PRODUCER_CONSUMER_COLLISION_VALIDATION_01.json
            docs/MACHINE_SOURCE_PRODUCER_SEMANTIC_EQUALITY_01.json
            docs/MACHINE_ENDING_PREREQUISITE_SATISFIABILITY_VALIDATION_01.json
            docs/MACHINE_ENDING_ALIAS_BOUNDARY_VALIDATION_01.json
            docs/MACHINE_COMPOSITE_SOURCE_CLOSURE_01.json
            docs/MACHINE_PREDICATE_DEPENDENCY_AUDIT_01.json
            docs/MACHINE_PREDICATE_DEPENDENCY_VALIDATION_01.json
            docs/MACHINE_PREDICATE_OPEN_BOUNDARY_01.json
            docs/MACHINE_SCENARIO_QA_GATE_MATRIX_01.json
            docs/MACHINE_ENDING_PRECEDENCE_BOUNDARY_01.json
          if-no-files-found: error
