name: Choice Kingdom Canonical Graph

on:
  push:
  pull_request:

jobs:
  canonical-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-level canonical graph contract
        run: python3 tools/validate_canonical_graph.py
      - name: Compile graph node classification inventory
        run: python3 tools/classify_graph_nodes.py
      - name: Compile producer consumer matrix
        run: python3 tools/compile_producer_consumer_matrix.py
      - name: Compile conservative candidate triage
        run: python3 tools/triage_graph_candidates.py
      - name: Audit semantic candidate boundary
        run: python3 tools/audit_candidate_semantic_boundary.py
      - name: Audit conservative structural reachability
        run: python3 tools/audit_structural_reachability.py
