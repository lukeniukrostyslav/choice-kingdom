name: GameSession Presentation Bridge Gate

on:
  push:
  pull_request:

jobs:
  presentation-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run GameSession presentation bridge tests
        run: python -m pytest -q tests/test_presentation_bridge.py
