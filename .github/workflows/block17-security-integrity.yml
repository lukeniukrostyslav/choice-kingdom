name: Block 17 — Security & Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Compile runtime and security tests
        run: python -m compileall -q runtime tests

      - name: Run security and integrity regression suite
        run: |
          python -m pytest -q \
            tests/test_runtime_state.py             tests/test_game_session_persistence_recovery.py             tests/test_persistence_resume_boundary.py             tests/test_block17_security_integrity_contract.py

      - name: Publish JUnit evidence
        if: always()
        run: |
          python -m pytest -q             tests/test_runtime_state.py             tests/test_game_session_persistence_recovery.py             tests/test_persistence_resume_boundary.py             tests/test_block17_security_integrity_contract.py             --junitxml=block17-junit.xml

      - name: Upload Block 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block17-security-integrity-evidence
          path: block17-junit.xml
