name: Choice Kingdom Authored Choice Execution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  authored-choice-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Validate authored source contract first
        run: python tools/audit_choice_state_transitions.py
      - name: Execute representative authored runtime choices
        run: python -m pytest -q tests/test_authored_choice_execution.py tests/test_runtime_state.py
      - name: Execute delayed lifecycle runtime gate
        run: python -m pytest -q tests/test_delayed_lifecycle_runtime.py tests/test_runtime_state.py
      - name: Execute delayed target runtime gate
        run: python -m pytest -q tests/test_delayed_target_execution.py
      - name: Verify immediate routing does not leak delayed unlocks
        run: python -m pytest -q tests/test_authored_choice_execution.py -k e01_a_executes_authored_immediate_state_transition
      # Push-triggered runtime gate is intentionally kept on main so each routing change is executable-verified.
      # PR execution is also retained as a deterministic verification path for protected changes.
