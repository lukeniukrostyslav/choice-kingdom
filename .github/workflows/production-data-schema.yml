name: Production data schema gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/EVENT_CATALOG*.md'
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'docs/PRODUCTION_DATA_SCHEMA_CONTRACT_V1.md'
      - 'runtime/catalog.py'
      - 'runtime/state.py'
      - 'tools/validate_production_data_schema.py'
      - 'tools/validate_production_catalog.py'
      - 'tests/test_production_data_schema.py'
      - 'tests/test_production_catalog.py'
      - '.github/workflows/production-data-schema.yml'
  pull_request:
    paths:
      - 'docs/EVENT_CATALOG*.md'
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'docs/PRODUCTION_DATA_SCHEMA_CONTRACT_V1.md'
      - 'runtime/catalog.py'
      - 'runtime/state.py'
      - 'tools/validate_production_data_schema.py'
      - 'tools/validate_production_catalog.py'
      - 'tests/test_production_data_schema.py'
      - 'tests/test_production_catalog.py'
      - '.github/workflows/production-data-schema.yml'

jobs:
  production-data-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pytest
      - name: Validate production catalog
        run: python tools/validate_production_catalog.py
      - name: Validate production data schema
        run: python tools/validate_production_data_schema.py
      - name: Run production catalog and schema tests
        run: python -m pytest -q tests/test_production_catalog.py tests/test_production_data_schema.py
