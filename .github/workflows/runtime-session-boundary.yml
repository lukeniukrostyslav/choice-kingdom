name: Choice Kingdom Runtime Session Boundary

on:
  push:
    paths:
      - "runtime/**"
      - "tests/**"
      - "tools/validate_runtime_session_boundary.py"
      - ".github/workflows/runtime-session-boundary.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - "tools/validate_runtime_session_boundary.py"
      - ".github/workflows/runtime-session-boundary.yml"

jobs:
  runtime-session-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q tests/test_game_session.py
      - run: PYTHONPATH=. python tools/validate_runtime_session_boundary.py
