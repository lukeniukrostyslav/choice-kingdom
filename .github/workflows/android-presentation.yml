name: Android Presentation Gate

on:
  push:
    branches: [main]
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-presentation.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-presentation.yml'

jobs:
  android-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7.3'
      - name: Build Android presentation
        working-directory: androidApp
        run: gradle --no-daemon assembleDebug
      - name: Run Android JVM tests
        working-directory: androidApp
        run: gradle --no-daemon test
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_2
          script: cd androidApp && gradle --no-daemon connectedDebugAndroidTest
