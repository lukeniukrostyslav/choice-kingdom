name: Choice Kingdom Machine Delay Contract

on:
  push:
    branches: [main]
    paths:
      - 'docs/MACHINE_DELAY_CONTRACT_01.json'
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'tools/validate_machine_delay_contract.py'
      - '.github/workflows/scenario-delay-contract.yml'
  pull_request:
    paths:
      - 'docs/MACHINE_DELAY_CONTRACT_01.json'
      - 'docs/MACHINE_CANONICAL_GRAPH_01.json'
      - 'tools/validate_machine_delay_contract.py'
      - '.github/workflows/scenario-delay-contract.yml'

jobs:
  delay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate machine delayed consequence contract
        run: python3 tools/validate_machine_delay_contract.py
