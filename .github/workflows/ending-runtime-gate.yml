name: Choice Kingdom Ending Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'runtime/engine.py'
      - 'runtime/endings.py'
      - 'runtime/ending_contract.py'
      - 'runtime/ending_sources.py'
      - 'runtime/ending_precedence.py'
      - 'runtime/state.py'
      - 'docs/MACHINE_ENDING_PRECEDENCE_TABLE_01.json'
      - 'docs/MACHINE_BUDGET_REFORM_CONTRACT_01.json'
      - 'docs/MACHINE_FINAL_CHARTER_CONTRACT_01.json'
      - 'docs/MACHINE_CONSTITUTIONAL_PREPARED_CONTRACT_01.json'
      - 'docs/MACHINE_SYSTEMIC_EXPLANATION_CONTRACT_01.json'
      - 'docs/MACHINE_COALITION_COOPERATION_CONTRACT_01.json'
      - 'docs/MACHINE_GUILD_INFLUENCE_CONTRACT_01.json'
      - 'tests/test_ending_resolver.py'
      - 'tests/test_ending_contract.py'
      - 'tests/test_ending_sources.py'
      - 'tests/test_ending_sources_runtime.py'
      - 'tests/test_ending_producer_runtime_binding.py'
      - 'tests/test_ending_qa_p01_p30_runtime.py'
      - 'tests/test_budget_reform_contract.py'
      - 'tests/test_final_charter_contract.py'
      - 'tests/test_constitutional_prepared_contract.py'
      - 'tests/test_ending_source_contract_inventory.py'
      - 'tests/test_systemic_coalition_contracts.py'
      - 'tests/test_guild_influence_contract.py'
      - 'tools/audit_composite_predicate_source_closure.py'
      - '.github/workflows/ending-runtime-gate.yml'
  pull_request:
    paths:
      - 'runtime/engine.py'
      - 'runtime/endings.py'
      - 'runtime/ending_contract.py'
      - 'runtime/ending_sources.py'
      - 'runtime/ending_precedence.py'
      - 'runtime/state.py'
      - 'docs/MACHINE_ENDING_PRECEDENCE_TABLE_01.json'
      - 'docs/MACHINE_BUDGET_REFORM_CONTRACT_01.json'
      - 'docs/MACHINE_FINAL_CHARTER_CONTRACT_01.json'
      - 'docs/MACHINE_CONSTITUTIONAL_PREPARED_CONTRACT_01.json'
      - 'docs/MACHINE_SYSTEMIC_EXPLANATION_CONTRACT_01.json'
      - 'docs/MACHINE_COALITION_COOPERATION_CONTRACT_01.json'
      - 'docs/MACHINE_GUILD_INFLUENCE_CONTRACT_01.json'
      - 'tests/test_ending_resolver.py'
      - 'tests/test_ending_contract.py'
      - 'tests/test_ending_sources.py'
      - 'tests/test_ending_sources_runtime.py'
      - 'tests/test_ending_producer_runtime_binding.py'
      - 'tests/test_ending_qa_p01_p30_runtime.py'
      - 'tests/test_budget_reform_contract.py'
      - 'tests/test_final_charter_contract.py'
      - 'tests/test_constitutional_prepared_contract.py'
      - 'tests/test_ending_source_contract_inventory.py'
      - 'tests/test_systemic_coalition_contracts.py'
      - 'tests/test_guild_influence_contract.py'
      - 'tools/audit_composite_predicate_source_closure.py'
      - '.github/workflows/ending-runtime-gate.yml'

jobs:
  ending-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Validate authored ending QA matrix
        run: python tools/validate_ending_test_matrix_contract.py
      - name: Resolver contract and precedence tests
        run: python -m pytest -q tests/test_ending_resolver.py tests/test_ending_contract.py
      - name: Ending source compiler tests
        run: python -m pytest -q tests/test_ending_sources.py tests/test_ending_sources_runtime.py
      - name: Source contract inventory tests
        run: python -m pytest -q tests/test_budget_reform_contract.py tests/test_final_charter_contract.py tests/test_constitutional_prepared_contract.py tests/test_ending_source_contract_inventory.py tests/test_systemic_coalition_contracts.py tests/test_guild_influence_contract.py
      - name: Producer runtime binding tests
        run: python -m pytest -q tests/test_ending_producer_runtime_binding.py
      - name: Executable P01-P30 ending QA fixtures
        run: python -m pytest -q tests/test_ending_qa_p01_p30_runtime.py
      - name: Runtime state persistence tests
        run: python -m pytest -q tests/test_runtime_state.py
