name: Choice Kingdom Ending Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'runtime/endings.py'
      - 'runtime/state.py'
      - 'tests/test_ending_resolver.py'
      - '.github/workflows/ending-runtime-gate.yml'
  pull_request:
    paths:
      - 'runtime/endings.py'
      - 'runtime/state.py'
      - 'tests/test_ending_resolver.py'
      - '.github/workflows/ending-runtime-gate.yml'

jobs:
  ending-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Validate authored ending QA matrix
        run: python tools/validate_ending_test_matrix_contract.py
      - name: Execute ending resolver runtime gate
        run: python -m pytest -q tests/test_ending_resolver.py tests/test_runtime_state.py
