name: Design Visual Regression Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory web-preview >/tmp/choice-kingdom-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/choice-kingdom-http.log
          exit 1

      - name: Capture mobile visual regression matrix
        run: |
          mkdir -p artifacts/visual-regression
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const pages = [
            'index.html',
            'game-flow.html',
            'artwork-preview.html',
            'design-art-direction.html',
            'design-asset-production.html',
            'design-accessibility-final.html',
            'design-character-faction-final.html'
          ];
          const viewports = [
            { name: '360x800', width: 360, height: 800 },
            { name: '412x915', width: 412, height: 915 },
            { name: '412x1000', width: 412, height: 1000 },
            { name: '1440x900', width: 1440, height: 900 }
          ];
          const requiredArtwork = [
            'artwork/event-empty-granary.svg',
            'artwork/queen-elira.svg',
            'artwork/lord-cael.svg',
            'artwork/river-compact.svg',
            'artwork/ending-chronicle.svg'
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const results = [];
            let runtimeFailures = 0;
            for (const file of pages) {
              for (const vp of viewports) {
                const context = await browser.newContext({ deviceScaleFactor: 1, reducedMotion: 'reduce' });
                const page = await context.newPage({ viewport: { width: vp.width, height: vp.height } });
                const consoleErrors = [];
                const pageErrors = [];
                const failedRequests = [];
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('pageerror', error => pageErrors.push(String(error)));
                page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure()?.errorText || 'unknown' }));
                const response = await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'networkidle' });
                const metrics = await page.evaluate(() => {
                  const interactive = [...document.querySelectorAll('a,button,input,select,textarea,[role="button"]')];
                  const rects = interactive.map(el => ({ el, rect: el.getBoundingClientRect(), text: (el.innerText || el.getAttribute('aria-label') || '').trim() }));
                  const smallTargets = rects.filter(({ rect }) => rect.width > 0 && rect.height > 0 && (rect.width < 48 || rect.height < 48));
                  const focusable = interactive.filter(el => !el.hasAttribute('disabled') && el.tabIndex >= 0);
                  const headings = [...document.querySelectorAll('h1,h2,h3')];
                  return {
                    title: document.title,
                    bodyScrollWidth: document.body.scrollWidth,
                    bodyClientWidth: document.body.clientWidth,
                    bodyScrollHeight: document.body.scrollHeight,
                    viewportWidth: window.innerWidth,
                    viewportHeight: window.innerHeight,
                    horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                    text: document.body.innerText.length,
                    brokenImages: [...document.images].filter(image => !image.complete || image.naturalWidth === 0).length,
                    interactiveCount: interactive.length,
                    smallTargets: smallTargets.map(({text, rect}) => ({ text, width: rect.width, height: rect.height })),
                    unlabeledControls: interactive.filter(el => !((el.innerText || '').trim() || el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.getAttribute('title'))).length,
                    focusableCount: focusable.length,
                    headingCount: headings.length,
                    hasSkipLink: Boolean(document.querySelector('a.skip[href="#main"], a[href="#main"]')),
                    hasLiveRegion: Boolean(document.querySelector('[aria-live]')),
                    hasNavLabel: Boolean(document.querySelector('[aria-label="Prototype navigation"]')),
                    hasReducedMotionCSS: [...document.styleSheets].some(() => true) && document.documentElement.outerHTML.includes('prefers-reduced-motion'),
                    hasThemeState: document.documentElement.hasAttribute('data-theme') || document.body.hasAttribute('data-theme'),
                    hasRtlControl: document.documentElement.outerHTML.includes('dir=') || document.documentElement.outerHTML.includes('RTL')
                  };
                });
                await page.screenshot({ path: `artifacts/visual-regression/${file.replace(/\W/g, '_')}-${vp.name}.png`, fullPage: true });
                const pass = Boolean(response && response.ok()) && !metrics.horizontalOverflow && metrics.text > 0 && metrics.brokenImages === 0 && metrics.smallTargets.length === 0 && metrics.unlabeledControls === 0 && metrics.hasSkipLink && metrics.hasLiveRegion && metrics.hasNavLabel && metrics.hasReducedMotionCSS && metrics.hasThemeState && metrics.hasRtlControl && consoleErrors.length === 0 && pageErrors.length === 0 && failedRequests.length === 0;
                if (!pass) runtimeFailures += 1;
                results.push({ file, viewport: vp.name, httpStatus: response ? response.status() : null, ...metrics, consoleErrors, pageErrors, failedRequests, pass });
                await context.close();
              }
            }
            const artworkResults = [];
            for (const asset of requiredArtwork) {
              const context = await browser.newContext({ deviceScaleFactor: 1 });
              const page = await context.newPage({ viewport: { width: 360, height: 800 } });
              const response = await page.goto(`http://127.0.0.1:4173/${asset}`, { waitUntil: 'networkidle' });
              const brokenImages = await page.evaluate(() => [...document.images].filter(image => !image.complete || image.naturalWidth === 0).length);
              const pass = Boolean(response && response.ok()) && brokenImages === 0;
              if (!pass) runtimeFailures += 1;
              artworkResults.push({ asset, httpStatus: response ? response.status() : null, brokenImages, pass });
              await context.close();
            }
            const manifest = { generatedAt: new Date().toISOString(), gate: 'V15', pages, viewports, requiredArtwork, results, artworkResults, runtimeFailures };
            fs.writeFileSync('artifacts/visual-regression/manifest.json', JSON.stringify(manifest, null, 2));
            await browser.close();
            if (runtimeFailures > 0) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Assert V15 evidence matrix is complete
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('artifacts/visual-regression/manifest.json', 'utf8'));
          const expected = m.pages.length * m.viewports.length;
          if (m.results.length !== expected) throw new Error(`Incomplete page matrix: ${m.results.length}/${expected}`);
          if (m.results.some(r => !r.pass)) throw new Error('V15 visual regression contains failing page/viewport evidence');
          if (m.artworkResults.length !== m.requiredArtwork.length || m.artworkResults.some(r => !r.pass)) throw new Error('V15 artwork evidence incomplete');
          if (m.runtimeFailures !== 0) throw new Error(`V15 runtimeFailures=${m.runtimeFailures}`);
          console.log(`V15 evidence PASS: ${m.results.length} page/viewport checks + ${m.artworkResults.length} artwork checks`);
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choice-kingdom-design-visual-regression
          path: artifacts/visual-regression/
          if-no-files-found: error
          retention-days: 14
