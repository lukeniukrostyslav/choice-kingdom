name: Design Visual Regression Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory web-preview >/tmp/choice-kingdom-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/choice-kingdom-http.log
          exit 1

      - name: Capture visual regression matrix
        run: |
          mkdir -p artifacts/visual-regression
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const pages = [
            'index.html',
            'game-flow.html',
            'artwork-preview.html',
            'design-art-direction.html',
            'design-asset-production.html',
            'design-accessibility-final.html',
            'design-character-faction-final.html'
          ];
          const viewports = [
            { name: '360x800', width: 360, height: 800 },
            { name: '412x915', width: 412, height: 915 },
            { name: '412x1000', width: 412, height: 1000 },
            { name: '1440x900', width: 1440, height: 900 }
          ];
          const requiredArtwork = [
            'artwork/event-empty-granary.svg',
            'artwork/queen-elira.svg',
            'artwork/lord-cael.svg',
            'artwork/river-compact.svg',
            'artwork/ending-chronicle.svg'
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ deviceScaleFactor: 1 });
            const results = [];
            let runtimeFailures = 0;
            for (const file of pages) {
              for (const vp of viewports) {
                const page = await context.newPage({ viewport: { width: vp.width, height: vp.height } });
                const consoleErrors = [];
                const pageErrors = [];
                const failedRequests = [];
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('pageerror', error => pageErrors.push(String(error)));
                page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure()?.errorText || 'unknown' }));
                const response = await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'networkidle' });
                const metrics = await page.evaluate(() => ({
                  title: document.title,
                  bodyScrollWidth: document.body.scrollWidth,
                  bodyClientWidth: document.body.clientWidth,
                  bodyScrollHeight: document.body.scrollHeight,
                  viewportWidth: window.innerWidth,
                  viewportHeight: window.innerHeight,
                  horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                  text: document.body.innerText.length,
                  brokenImages: [...document.images].filter(image => !image.complete || image.naturalWidth === 0).length
                }));
                const pass = Boolean(response && response.ok()) && !metrics.horizontalOverflow && metrics.text > 0 && metrics.brokenImages === 0 && consoleErrors.length === 0 && pageErrors.length === 0 && failedRequests.length === 0;
                if (!pass) runtimeFailures += 1;
                await page.screenshot({ path: `artifacts/visual-regression/${file.replace(/\W/g, '_')}-${vp.name}.png`, fullPage: true });
                results.push({ file, viewport: vp.name, httpStatus: response ? response.status() : null, ...metrics, consoleErrors, pageErrors, failedRequests, pass });
                await page.close();
              }
            }
            const artworkResults = [];
            for (const asset of requiredArtwork) {
              const page = await context.newPage({ viewport: { width: 360, height: 800 } });
              const response = await page.goto(`http://127.0.0.1:4173/${asset}`, { waitUntil: 'networkidle' });
              const brokenImages = await page.evaluate(() => [...document.images].filter(image => !image.complete || image.naturalWidth === 0).length);
              const pass = Boolean(response && response.ok()) && brokenImages === 0;
              if (!pass) runtimeFailures += 1;
              artworkResults.push({ asset, httpStatus: response ? response.status() : null, brokenImages, pass });
              await page.close();
            }
            fs.writeFileSync('artifacts/visual-regression/manifest.json', JSON.stringify({ generatedAt: new Date().toISOString(), pages, viewports, requiredArtwork, results, artworkResults, runtimeFailures }, null, 2));
            await browser.close();
            if (runtimeFailures > 0) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choice-kingdom-design-visual-regression
          path: artifacts/visual-regression/
          if-no-files-found: error
          retention-days: 14
