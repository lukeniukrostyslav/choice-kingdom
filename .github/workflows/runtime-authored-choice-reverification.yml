name: Choice Kingdom Authored Choice Reverification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  authored-choice-reverification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Validate authored source contract
        run: python tools/audit_choice_state_transitions.py
      - name: Execute authored runtime gate
        run: python -m pytest -q tests/test_authored_choice_execution.py tests/test_runtime_state.py
