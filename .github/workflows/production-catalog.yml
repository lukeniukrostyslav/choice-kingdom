name: Production catalog projection

on:
  push:
  pull_request:

jobs:
  validate-production-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python tools/validate_production_catalog.py
      - run: python -m pytest -q tests/test_production_catalog.py
