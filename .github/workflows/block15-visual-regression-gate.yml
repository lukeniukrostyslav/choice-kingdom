name: Choice Kingdom Block 15 Visual Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_baseline:
        description: "Regenerate and commit approved screenshot references"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  screenshot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify screenshot test configuration
        working-directory: androidApp
        run: |
          test -f ../gradle.properties
          grep -q '^android.experimental.enableScreenshotTest=true$' ../gradle.properties
          grep -q '^android.compose.screenshot.maxHeapSize=4g$' ../gradle.properties
          test -f app/src/screenshotTest/kotlin/com/choicekingdom/app/VisualRegressionScreenshotTest.kt

      - name: Detect reference set
        id: refs
        shell: bash
        run: |
          if find androidApp/app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate initial or explicitly approved references
        if: steps.refs.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.approve_baseline == true)
        working-directory: androidApp
        run: gradle --no-daemon updateDebugScreenshotTest --stacktrace

      - name: Assert generated reference set
        if: steps.refs.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.approve_baseline == true)
        shell: bash
        run: |
          count=$(find androidApp/app/src/screenshotTestDebug/reference -type f -name '*.png' | wc -l)
          test "$count" -gt 0
          echo "Generated screenshot references: $count"

      - name: Commit generated reference set
        if: steps.refs.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && inputs.approve_baseline == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/app/src/screenshotTestDebug/reference
          git diff --cached --quiet || git commit -m "Add approved visual regression references"
          git push

      - name: Validate reference set is non-empty
        if: steps.refs.outputs.exists == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.approve_baseline == true)
        shell: bash
        run: |
          count=$(find androidApp/app/src/screenshotTestDebug/reference -type f -name '*.png' | wc -l)
          test "$count" -gt 0
          echo "Committed screenshot references available: $count"

      - name: Validate existing reference set
        if: steps.refs.outputs.exists == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.approve_baseline == true)
        working-directory: androidApp
        run: gradle --no-daemon validateDebugScreenshotTest --stacktrace

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block15-screenshot-report
          path: |
            androidApp/app/build/reports/screenshotTest/**
            androidApp/app/build/reports/tests/**
          if-no-files-found: ignore
