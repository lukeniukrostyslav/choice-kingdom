name: V15 Visual Closure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  v15-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve web preview
        run: |
          python3 -m http.server 4173 --directory web-preview >/tmp/choice-kingdom-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/choice-kingdom-http.log
          exit 1

      - name: Run V15 executable visual closure
        run: node tools/v15_visual_closure.mjs

      - name: Upload V15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choice-kingdom-v15-visual-closure
          path: artifacts/visual-regression/
          if-no-files-found: error
          retention-days: 14
