name: Android production runtime

on:
  push:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleDebug --stacktrace
