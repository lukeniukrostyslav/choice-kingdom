name: Android production runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "tests/test_android_runtime.py"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "tests/test_android_runtime.py"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Python test runner
        working-directory: .
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify canonical Android adapter
        working-directory: .
        run: python -m pytest -q tests/test_android_runtime.py
      - name: Assemble debug APK
        env:
          GRADLE_OPTS: -Xmx8g -XX:MaxMetaspaceSize=2g -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.workers.max=1
        run: gradle :app:assembleDebug -Pp24CiAbi=x86_64 --stacktrace --no-daemon --max-workers=1
      - name: Verify APK was produced
        run: test -s app/build/outputs/apk/debug/app-debug.apk

  p24-android-execution:
    name: P24 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: compact-phone, width: 1080, height: 2400, density: 420}
          - {name: tablet-window, width: 1920, height: 2560, density: 320}
          - {name: expanded-window, width: 2688, height: 2800, density: 320}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare Android SDK and AVD
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"; fi
          if [ ! -x "$AVDMANAGER" ]; then AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | head -n1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force --name "p24-${{ matrix.name }}" --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          printf '%s
'             'hw.cpu.ncore=2'             'hw.ramSize=4096'             'hw.gpu.mode=swiftshader_indirect'             'hw.keyboard=yes'             >> "$HOME/.android/avd/p24-${{ matrix.name }}.avd/config.ini"
      - name: Run P24 Android execution
        env:
          GRADLE_OPTS: -Xmx8g -XX:MaxMetaspaceSize=2g -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.workers.max=1
        run: |
          set -euxo pipefail
          cd androidApp
          AVD_NAME="p24-${{ matrix.name }}"
          SERIAL="emulator-5554"
          trap 'adb -s "$SERIAL" emu kill >/dev/null 2>&1 || true' EXIT
          adb start-server
          "${ANDROID_HOME}/emulator/emulator" -avd "$AVD_NAME" -port 5554             -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim             -cores 2 -memory 4096 > emulator.log 2>&1 &
          EMULATOR_PID=$!
          for i in $(seq 1 180); do
            STATE="$(adb -s "$SERIAL" get-state 2>/dev/null || true)"
            if [ "$STATE" = "device" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            sleep 2
          done
          test "$(adb -s "$SERIAL" get-state)" = "device"
          for i in $(seq 1 180); do
            BOOT="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l
          adb shell wm size ${{ matrix.width }}x${{ matrix.height }}
          adb shell wm density ${{ matrix.density }}
          gradle :app:assembleDebug -Pp24CiAbi=x86_64 --no-daemon --max-workers=1
          gradle :app:installDebug -Pp24CiAbi=x86_64 --no-daemon --max-workers=1
          adb shell am force-stop com.choicekingdom.app
          adb shell am start -n com.choicekingdom.app/.MainActivity
          sleep 12
          adb shell dumpsys activity activities | grep -q com.choicekingdom.app
          mkdir -p p24-evidence
          adb exec-out screencap -p > p24-evidence/${{ matrix.name }}.png
          gradle :app:connectedDebugAndroidTest --tests com.choicekingdom.app.P24DeviceAdaptationTest --no-daemon --max-workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p24-${{ matrix.name }}-evidence
          path: androidApp/p24-evidence
          if-no-files-found: warn
          retention-days: 14
