name: Android production runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "tests/test_android_runtime.py"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"
  pull_request:
    paths:
      - "androidApp/**"
      - "runtime/**"
      - "tests/test_android_runtime.py"
      - "docs/MACHINE_CANONICAL_GRAPH_01.json"
      - "docs/EVENT_CATALOG*.md"
      - ".github/workflows/android-production-runtime.yml"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Python test runner
        working-directory: .
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify canonical Android adapter
        working-directory: .
        run: python -m pytest -q tests/test_android_runtime.py
      - name: Assemble debug APK
        env:
          GRADLE_OPTS: -Xmx12g -XX:MaxMetaspaceSize=2g -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.workers.max=1
        run: gradle :app:assembleDebug -Pp24CiAbi=x86_64 --stacktrace --no-daemon --max-workers=1
      - name: Assemble P24 instrumentation APK
        env:
          GRADLE_OPTS: -Xmx12g -XX:MaxMetaspaceSize=2g -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.workers.max=1
        run: gradle :app:assembleDebugAndroidTest -Pp24CiAbi=x86_64 --stacktrace --no-daemon --max-workers=1
      - name: Verify P24 APKs were produced
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload P24 APKs for device matrix
        uses: actions/upload-artifact@v4
        with:
          name: p24-debug-apks
          path: |
            androidApp/app/build/outputs/apk/debug/app-debug.apk
            androidApp/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  p24-android-execution:
    name: P24 ${{ matrix.name }}
    needs: debug-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compact-phone
            width: 1080
            height: 2400
            density: 420
          - name: tablet-window
            width: 1920
            height: 2560
            density: 320
          - name: expanded-window
            width: 2688
            height: 2800
            density: 320
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-p24-android-devices-2026-09-18

      - name: Download prebuilt P24 APKs
        uses: actions/download-artifact@v4
        with:
          name: p24-debug-apks
          path: androidApp/app/build/outputs/apk

      - name: Enable KVM and install emulator runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Android SDK and AVD
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"; fi
          if [ ! -x "$AVDMANAGER" ]; then AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | head -n1)"; fi
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          echo "no" | "$AVDMANAGER" create avd --force --name "p24-${{ matrix.name }}" --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          AVD_DIR="$ANDROID_AVD_HOME/p24-${{ matrix.name }}.avd"
          test -f "$AVD_DIR/config.ini"
          {
            echo "hw.cpu.ncore=2"
            echo "hw.ramSize=2048"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.keyboard=yes"
          } >> "$AVD_DIR/config.ini"

      - name: Run P24 Android execution
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"
          "$ADB" version
          "$ADB" start-server
          "$EMULATOR" -version
          SERIAL=emulator-5554

          test -s androidApp/app/build/outputs/apk/debug/app-debug.apk
          test -s androidApp/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

          "$EMULATOR" -avd "p24-${{ matrix.name }}" -port 5554 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 2 -memory 2048 > "$RUNNER_TEMP/p24-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            kill "$EMULATOR_PID" 2>/dev/null || true
            "$ADB" -s "$SERIAL" emu kill 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 120); do
            if "$ADB" -s "$SERIAL" get-state 2>/dev/null | grep -q device; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/p24-emulator.log"; exit 1; fi
            sleep 2
          done
          "$ADB" -s "$SERIAL" get-state | grep -q device

          for i in $(seq 1 150); do
            BOOT=$("$ADB" -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/p24-emulator.log"; exit 1; fi
            sleep 2
          done
          "$ADB" -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'

          "$ADB" -s "$SERIAL" shell wm size ${{ matrix.width }}x${{ matrix.height }}
          "$ADB" -s "$SERIAL" shell wm density ${{ matrix.density }}

          cd androidApp
          "$ADB" -s "$SERIAL" install -r app/build/outputs/apk/debug/app-debug.apk
          "$ADB" -s "$SERIAL" shell am force-stop com.choicekingdom.app
          "$ADB" -s "$SERIAL" shell am start -n com.choicekingdom.app/.MainActivity
          sleep 12
          "$ADB" -s "$SERIAL" shell dumpsys activity activities | grep -q com.choicekingdom.app
          mkdir -p p24-evidence
          "$ADB" -s "$SERIAL" exec-out screencap -p > "p24-evidence/${{ matrix.name }}.png"
          "$ADB" -s "$SERIAL" install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          INSTRUMENTATION=$("$ADB" -s "$SERIAL" shell pm list instrumentation | tr -d '\\r' | grep 'target=com.choicekingdom.app' | sed -n 's/^instrumentation:\\([^ ]*\\).*$/\\1/p' | head -n1)
          test -n "$INSTRUMENTATION"
          "$ADB" -s "$SERIAL" shell am instrument -w -r -e class com.choicekingdom.app.P24DeviceAdaptationTest "$INSTRUMENTATION"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p24-${{ matrix.name }}-evidence
          path: androidApp/p24-evidence
          if-no-files-found: warn
          retention-days: 14
